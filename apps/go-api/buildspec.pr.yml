version: 0.2

# PR 预览环境流水线（由 infra/pr-preview.yaml 的 CodeBuild 项目执行）。
# StartBuild 时经环境变量覆盖注入：PR_NUMBER、PR_ACTION（opened/synchronize/closed）、PR_HEAD_SHA。
# opened/synchronize → 构建镜像 + 部署 per-PR 栈 + Cloudflare 指向；closed → 拆栈 + 删 DNS。

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - test -n "$PR_NUMBER" || { echo "PR_NUMBER required"; exit 1; }
      - STACK="${MAIN_STACK_NAME}-pr-${PR_NUMBER}"
      - IMAGE="${PREVIEW_ECR_URI}:pr-${PR_NUMBER}-${PR_HEAD_SHA:-latest}"
      - SUBDOMAIN="pr-${PR_NUMBER}.${CLOUDFLARE_ZONE}"
      - REGISTRY="$(echo "$PREVIEW_ECR_URI" | cut -d/ -f1)"
      # 从 Secrets Manager 取 Cloudflare 凭据（apiToken / zoneId），不落日志
      - CF_JSON="$(aws secretsmanager get-secret-value --secret-id "$CLOUDFLARE_SECRET_ARN" --query SecretString --output text)"
      - CF_TOKEN="$(echo "$CF_JSON" | jq -r .apiToken)"
      - CF_ZONE_ID="$(echo "$CF_JSON" | jq -r .zoneId)"
      - CF_API="https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records"

  build:
    commands:
      # ───── PR 关闭：拆除预览环境并删除 DNS，然后结束 ─────
      - |
        if [ "${PR_ACTION:-}" = "closed" ]; then
          echo "PR #${PR_NUMBER} closed -> tearing down ${STACK}"
          aws cloudformation delete-stack --stack-name "$STACK" || true
          aws cloudformation wait stack-delete-complete --stack-name "$STACK" || true
          REC_ID="$(curl -sf -H "Authorization: Bearer ${CF_TOKEN}" "${CF_API}?name=${SUBDOMAIN}" | jq -r '.result[0].id // empty')"
          if [ -n "$REC_ID" ]; then
            curl -sf -X DELETE -H "Authorization: Bearer ${CF_TOKEN}" "${CF_API}/${REC_ID}" >/dev/null
            echo "deleted DNS ${SUBDOMAIN}"
          fi
          exit 0
        fi
      # ───── 构建并推送 arm64 镜像（CodeBuild ARM 容器原生构建）─────
      - aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
      - docker build --platform linux/arm64 -t "$IMAGE" apps/go-api
      - docker push "$IMAGE"

  post_build:
    commands:
      - |
        if [ "${PR_ACTION:-}" = "closed" ]; then exit 0; fi
      # ───── 部署 per-PR 独立环境栈 ─────
      - |
        aws cloudformation deploy \
          --stack-name "$STACK" \
          --template-file infra/pr-preview-env.yaml \
          --capabilities CAPABILITY_IAM \
          --no-fail-on-empty-changeset \
          --parameter-overrides \
            MainStackName="$MAIN_STACK_NAME" \
            PrNumber="$PR_NUMBER" \
            ImageUri="$IMAGE" \
            RuntimeRoleArn="$RUNTIME_ROLE_ARN"
      - aws ecs wait services-stable --cluster "$STACK" --services "$STACK"
      # ───── 取任务公网 IP，upsert Cloudflare A 记录（proxied）─────
      - TASK_ARN="$(aws ecs list-tasks --cluster "$STACK" --service-name "$STACK" --query 'taskArns[0]' --output text)"
      - ENI="$(aws ecs describe-tasks --cluster "$STACK" --tasks "$TASK_ARN" --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value | [0]' --output text)"
      - IP="$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" --query 'NetworkInterfaces[0].Association.PublicIp' --output text)"
      - test -n "$IP" && test "$IP" != "None" || { echo "no public IP yet"; exit 1; }
      - |
        BODY="{\"type\":\"A\",\"name\":\"${SUBDOMAIN}\",\"content\":\"${IP}\",\"ttl\":60,\"proxied\":true}"
        REC_ID="$(curl -sf -H "Authorization: Bearer ${CF_TOKEN}" "${CF_API}?name=${SUBDOMAIN}" | jq -r '.result[0].id // empty')"
        if [ -n "$REC_ID" ]; then
          curl -sf -X PUT  -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" -d "$BODY" "${CF_API}/${REC_ID}" >/dev/null
        else
          curl -sf -X POST -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" -d "$BODY" "${CF_API}" >/dev/null
        fi
      - echo "PR #${PR_NUMBER} preview -> https://${SUBDOMAIN} (origin ${IP}:8080)"
