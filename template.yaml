AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Hono(API + 页面) + Drizzle + Aurora PostgreSQL Serverless v2，部署在同一个 VPC：
  1 个公有子网(IGW + NAT 对外上网) + 2 个私有子网(部署 Lambda 与 Aurora)。

Parameters:
  CorsOrigin:
    Type: String
    Default: "*"
    Description: 浏览器跨域来源；用页面同源访问时 * 即可。
  DBName:
    Type: String
    Default: appdb
  DBUsername:
    Type: String
    Default: app_admin
  BasicAuthUser:
    Type: String
    Default: admin
    Description: 页面/接口 Basic Auth 用户名（密码自动生成在 AuthSecret 里）。
  OpenRouterModel:
    Type: String
    Default: openai/gpt-4o-mini
    Description: Lambda 调 OpenRouter 生成 bio 用的模型；密钥填在 OpenRouterSecret 里。
  ApiDomainName:
    Type: String
    Default: ""
    Description: API 自定义域名（如 api.faithcal.xyz）；留空则不启用自定义域名。
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: >
      本区域(ap-northeast-1)已签发的 ACM 证书 ARN（覆盖 ApiDomainName）。
      与 ApiDomainName 同时提供才启用自定义域名——证书预先建好可避免建栈时等 DNS 校验卡住。
  LambdaBoundaryName:
    Type: String
    Default: github-repositories-fllow-lambda-boundary
    Description: >
      Lambda 执行角色的权限边界名（由 infra/github-oidc.yaml 预先创建）。
      给 Lambda 角色挂边界后，CI 部署角色才允许创建它，且其实际权限被边界封顶。

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    # 512MB：兼顾托管静态 SPA 资源与更快冷启动（CPU 随内存线性提升）。
    MemorySize: 512
    Architectures: [arm64]

Conditions:
  # 同时提供域名与证书 ARN 才启用 API 自定义域名
  HasCustomDomain: !And
    - !Not [!Equals [!Ref ApiDomainName, ""]]
    - !Not [!Equals [!Ref ApiCertificateArn, ""]]

Resources:
  # ──────────────────────────── 网络 ────────────────────────────
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # 公有子网：放 NAT，路由走 IGW（对外上网的那一个子网）
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  # 第二个公有子网（AZ-c）：PR 预览的共享内网入口 ALB 需横跨 2 个 AZ 的公有子网。
  # 主链路不依赖它；只在启用 PR 预览平台栈时被引用。
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-2" }]

  # 两个私有子网：部署 Lambda + Aurora（跨 2 个 AZ）
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-1" }]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-2" }]

  # NAT 网关（Lambda 经它出网调 api.github.com）
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-nat" }]

  # 公有路由表：0.0.0.0/0 -> IGW
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet
  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # 私有路由表：0.0.0.0/0 -> NAT
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1
  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  # ──────────────────────────── 安全组 ────────────────────────────
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda egress (NAT + Aurora)
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-lambda-sg" }]

  # Aurora 只允许来自 ECS Go 服务的 5432（入站规则在 infra/ecs-fargate.yaml 里按 ECS SG 添加）。
  # Lambda 是薄代理、不直连 RDS，故此处不再放行 Lambda SG（网络层坐实「Lambda 不连库」）。
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora SG - allow 5432 from ECS Go service only
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db-sg" }]

  # ──────────────────────────── 数据库凭据 ────────────────────────────
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "${AWS::StackName} Aurora master credential"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true # 生成纯字母数字密码，可安全放进 DATABASE_URL

  # 页面/接口 Basic Auth 的密码（自动生成）。部署后用以下命令查看：
  #   aws secretsmanager get-secret-value --secret-id <AuthSecret 的 ARN> --query SecretString
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "${AWS::StackName} 页面/接口 Basic Auth 密码"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${BasicAuthUser}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  # OpenRouter API key（占位空串）。建栈后用真实 key 覆盖再重部署即可启用 LLM 生成 bio：
  #   aws secretsmanager put-secret-value --secret-id <此ARN> --secret-string '{"apiKey":"<key>"}'
  # 未设置时 apiKey 为空串，Lambda 自动回退到模板文案。
  OpenRouterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "${AWS::StackName} OpenRouter API key for bio generation"
      SecretString: '{"apiKey":""}'

  # ──────────────────────────── Aurora Serverless v2 ────────────────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurora private subnet group
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  DBCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-postgresql
      DatabaseName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds: [!Ref DBSecurityGroup]
      Port: 5432
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 2

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql

  # ──────────────────────────── Lambda(Hono) + HTTP API ────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: apps/server/dist/
      Handler: lambda.handler
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${LambdaBoundaryName}"
      Policies:
        - AWSLambdaVPCAccessExecutionRole
      Environment:
        Variables:
          NODE_ENV: production
          CORS_ORIGIN: !Ref CorsOrigin
          BASIC_AUTH_USER: !Ref BasicAuthUser
          BASIC_AUTH_PASSWORD: !Sub "{{resolve:secretsmanager:${AuthSecret}:SecretString:password}}"
          # 薄代理：/api/* 转发到 Cloud Map 内网 DNS 上的 Go 服务；Lambda 不含 DATABASE_URL。
          GO_API_URL: !Sub "http://go-api.${AWS::StackName}.internal:8080"
          # bio 生成：置真实 key 后（put-secret-value + 重部署）走 OpenRouter，否则回退模板。
          OPENROUTER_API_KEY: !Sub "{{resolve:secretsmanager:${OpenRouterSecret}:SecretString:apiKey}}"
          OPENROUTER_MODEL: !Ref OpenRouterModel
      Events:
        Root:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

  # ─── API 自定义域名（可选，Cloudflare 侧再把 api.faithcal.xyz CNAME 到下方 target）───
  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref ApiDomain
      Stage: $default

Outputs:
  ApiUrl:
    Description: 访问页面/接口的地址
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ApiDomainTarget:
    Condition: HasCustomDomain
    Description: 在 Cloudflare 把 ApiDomainName 用 DNS-only CNAME 指向这个地址
    Value: !GetAtt ApiDomain.RegionalDomainName
  DBEndpoint:
    Description: Aurora 写入端点
    Value: !GetAtt DBCluster.Endpoint.Address
  AuthSecretArn:
    Description: 取 Basic Auth 密码 (aws secretsmanager get-secret-value --secret-id <此ARN>)
    Value: !Ref AuthSecret

  # ─── 跨栈导出：供 infra/ecs-fargate.yaml（Task 2）用 Fn::ImportValue 引用 ───
  # 主栈是网络与数据的唯一属主，ECS 栈只消费、不重复建 VPC/子网/数据库。
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${AWS::StackName}-VpcId" }
  PublicSubnetId:
    Value: !Ref PublicSubnet
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnet" }
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnet2" }
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnet1" }
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnet2" }
  DBSecurityGroupId:
    Value: !Ref DBSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-DBSecurityGroup" }
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-LambdaSecurityGroup" }
  ApiFunctionArn:
    Value: !GetAtt ApiFunction.Arn
    Export: { Name: !Sub "${AWS::StackName}-ApiFunctionArn" }
  ApiEndpoint:
    Description: Hono HTTP API 域名（ECS Go 服务经 Cloud Map 指向它）
    Value: !Sub "${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export: { Name: !Sub "${AWS::StackName}-ApiEndpoint" }
  DBSecretArn:
    Value: !Ref DBSecret
    Export: { Name: !Sub "${AWS::StackName}-DBSecretArn" }
  AuthSecretArnExport:
    Value: !Ref AuthSecret
    Export: { Name: !Sub "${AWS::StackName}-AuthSecretArn" }
  DBName:
    Value: !Ref DBName
    Export: { Name: !Sub "${AWS::StackName}-DBName" }
  DBUsername:
    Value: !Ref DBUsername
    Export: { Name: !Sub "${AWS::StackName}-DBUsername" }
  DBClusterEndpoint:
    Value: !GetAtt DBCluster.Endpoint.Address
    Export: { Name: !Sub "${AWS::StackName}-DBClusterEndpoint" }
