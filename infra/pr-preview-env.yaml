AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Per-PR preview: one ephemeral Fargate task (go-api + throwaway Postgres sidecar)
  behind the shared preview ALB via a per-PR TargetGroup + host listener rule
  (api-pr-<n>.<zone>). Private subnets, no public IP. Networking/ALB imported from
  the main + pr-preview platform stacks. Nothing here touches prod data.

Parameters:
  MainStackName:
    Type: String
    Default: github-repositories-fllow
  PrNumber:
    Type: Number
    Description: PR 编号，用作命名、Host 子域和监听规则优先级。
  ImageUri:
    Type: String
    Description: 本次 PR 构建并推送的 go-api 镜像（含 tag）。
  RuntimeRoleArn:
    Type: String
    Description: 预览任务的执行/任务角色（pr-preview.yaml 的 PrPreviewRuntimeRole）。
  PreviewZone:
    Type: String
    Default: faithcal.xyz
    Description: 预览子域根域；Host 规则匹配 api-pr-<n>.<zone>。

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${MainStackName}-pr-${PrNumber}"
      RetentionInDays: 3

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${MainStackName}-pr-${PrNumber}"

  # 任务安全组：只放行来自共享预览 ALB 的 8080（不再暴露公网）
  PreviewSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PR preview task - allow 8080 from shared preview ALB only
      VpcId: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub "${MainStackName}-pr-${PrNumber}-sg" }]
  IngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PreviewSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !ImportValue
        Fn::Sub: "${MainStackName}-PreviewAlbSecurityGroup"

  # 每 PR 目标组 + Host 监听规则（挂到共享 ALB）
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${MainStackName}-pr-${PrNumber}"
      VpcId: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "5" }

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue
        Fn::Sub: "${MainStackName}-PreviewAlbListenerArn"
      # PR 编号天然唯一，直接作优先级（1-50000）
      Priority: !Ref PrNumber
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Sub "api-pr-${PrNumber}.${PreviewZone}"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${MainStackName}-pr-${PrNumber}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref RuntimeRoleArn
      TaskRoleArn: !Ref RuntimeRoleArn
      ContainerDefinitions:
        # 一次性 Postgres：随任务生死，PR 环境彼此隔离、绝不碰生产库
        - Name: postgres
          Image: public.ecr.aws/docker/library/postgres:16-alpine
          Essential: true
          Environment:
            - { Name: POSTGRES_USER, Value: postgres }
            - { Name: POSTGRES_PASSWORD, Value: postgres }
            - { Name: POSTGRES_DB, Value: appdb }
          PortMappings:
            - { ContainerPort: 5432, Protocol: tcp }
          HealthCheck:
            Command: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: postgres
        - Name: go-api
          Image: !Ref ImageUri
          Essential: true
          # 等 Postgres 健康再启动，冷启动 ensureSchema 才能建表
          DependsOn:
            - { ContainerName: postgres, Condition: HEALTHY }
          Environment:
            - { Name: PORT, Value: "8080" }
            - { Name: DATABASE_URL, Value: "postgresql://postgres:postgres@localhost:5432/appdb?sslmode=disable" }
            # 预览环境默认不开 Basic Auth，方便直接点开验证
          PortMappings:
            - { ContainerPort: 8080, Protocol: tcp }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: go-api

  Service:
    Type: AWS::ECS::Service
    # 目标组必须先经监听规则挂到 ALB，服务才能注册
    DependsOn: ListenerRule
    Properties:
      ServiceName: !Sub "${MainStackName}-pr-${PrNumber}"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          # 私有子网 + 经主栈 NAT 拉镜像；不分配公网 IP，入口只走共享 ALB
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "${MainStackName}-PrivateSubnet1"
            - !ImportValue
              Fn::Sub: "${MainStackName}-PrivateSubnet2"
          SecurityGroups: [!Ref PreviewSecurityGroup]
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: go-api
          ContainerPort: 8080

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !Sub "${MainStackName}-pr-${PrNumber}"
  PreviewUrl:
    Description: 预览地址（Cloudflare DNS-only CNAME api-pr-<n> → 共享 ALB）
    Value: !Sub "http://api-pr-${PrNumber}.${PreviewZone}"
