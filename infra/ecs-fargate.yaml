AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Go API on ECS Fargate with native 10 percent canary deployments, an internal
  ALB, two target groups, alarm rollback and stable private DNS.
  Release flow includes a private Green validation listener and lifecycle hook.
  This stack imports the VPC/subnets/DB from the main stack (template.yaml) and
  does not recreate any network or database resource.

Parameters:
  MainStackName:
    Type: String
    Default: github-repositories-fllow
    Description: 主栈名，用于 Fn::ImportValue 引用其 VPC/子网/数据库/Lambda 导出。
  ImageTag:
    Type: String
    Default: bootstrap
    Description: 要运行的 go-api 镜像 tag（CI/CodeBuild 推镜像后传入 commit SHA）。
  DesiredCount:
    Type: Number
    Default: 1
    Description: 首次部署（ECR 尚无镜像）时先设 0，推镜像后再设 1，避免服务无法稳定导致回滚。
  BasicAuthUser:
    Type: String
    Default: admin
    Description: 与主栈一致的 Basic Auth 用户名（密码从主栈 AuthSecret 注入）。
  MessagingStackName:
    Type: String
    Default: ""
    Description: Messaging stack name. Empty disables domain event publishing.
  SyntheticsAlarmName:
    Type: String
    Default: ""
    Description: Optional CloudWatch Synthetics alarm included in ECS canary rollback.
  EnableCanary:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Enable native ECS canary after the Hono proxy is routed through the ALB.

Conditions:
  HasDesiredCount: !Not [!Equals [!Ref DesiredCount, 0]]
  HasMessagingStack: !Not [!Equals [!Ref MessagingStackName, ""]]
  HasSyntheticsAlarm: !Not [!Equals [!Ref SyntheticsAlarmName, ""]]
  IsCanaryEnabled: !Equals [!Ref EnableCanary, "true"]

Resources:
  # ──────────────────────────── ECR ────────────────────────────
  EcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Sub "${MainStackName}-go-api"
      EmptyOnDelete: true # 拆栈时连同镜像一起删，验收后不留仓库
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        # 只保留最近 10 个镜像，untagged 1 天后过期，控制存储成本
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "expire untagged images after 1 day",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "keep last 10 images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }

  # ──────────────────────────── 日志 ────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${MainStackName}-go-api"
      RetentionInDays: 14

  # ──────────────────────────── Cloud Map（服务发现与无中断迁移）────────────────────────────
  # 旧的 go-api.<stack>.internal A 记录继续作为回退入口；新的
  # go-api-alb.<stack>.internal Alias 指向 Canary Internal ALB。流水线在 ECS
  # 稳定后才通过 Lambda 灰度把生产代理切到新地址。
  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub "${MainStackName}.internal"
      Vpc: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"

  CloudMapService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: go-api
      NamespaceId: !GetAtt CloudMapNamespace.Id
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 15
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ──────────────────────────── 安全组 ────────────────────────────
  # Internal ALB 的 SG：生产 Listener 只允许 Hono Lambda；测试 Listener 只允许发布 Hook。
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Keep the existing immutable description to avoid replacing the production SG.
      GroupDescription: Internal test ALB - allow 80 from within VPC only
      VpcId: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !ImportValue
            Fn::Sub: "${MainStackName}-LambdaSecurityGroup"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub "${MainStackName}-alb-sg" }]

  CanaryHookSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS canary validation hook with access to the private test listener
      VpcId: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub "${MainStackName}-canary-hook-sg" }]

  AlbTestIngressFromCanaryHook:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      SourceSecurityGroupId: !Ref CanaryHookSecurityGroup

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Keep the existing immutable description; ingress remains limited to Lambda/ALB SGs.
      GroupDescription: Fargate task - allow 8080 from Lambda and test ALB
      VpcId: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags: [{ Key: Name, Value: !Sub "${MainStackName}-ecs-sg" }]
  # 保留旧 Cloud Map 直连入口用于部署迁移和紧急回退；仅 Lambda SG 可访问。
  EcsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !ImportValue
        Fn::Sub: "${MainStackName}-LambdaSecurityGroup"
  # 所有生产请求由 Internal ALB 转发到当前蓝/绿目标组。
  EcsIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  # 让 Fargate 任务能连主栈的 Aurora（主栈 DB SG 原本只放行 Lambda SG）
  DbIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue
        Fn::Sub: "${MainStackName}-DBSecurityGroup"
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  # ──────────────────────────── ALB（生产内网入口）────────────────────────────
  # API Gateway→Lambda→Route 53 private Alias→Internal ALB→ECS。ALB 不对公网开放。
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      # 不显式命名（栈名较长，ALB 名有 32 字符上限）；CFN 自动生成合规名
      Type: application
      Scheme: internal
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - !ImportValue
          Fn::Sub: "${MainStackName}-PrivateSubnet1"
        - !ImportValue
          Fn::Sub: "${MainStackName}-PrivateSubnet2"

  # Blue 目标组。ECS 在每次部署后会交换蓝/绿角色。
  EcsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${MainStackName}-go-tg"
      VpcId: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }

  EcsCanaryTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${MainStackName}-go-b"
      VpcId: !ImportValue
        Fn::Sub: "${MainStackName}-VpcId"
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"error":"route_not_configured"}'
            StatusCode: "404"

  ProductionListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values: ["/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref EcsTargetGroup

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 8081
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            ContentType: application/json
            MessageBody: '{"error":"test_route_not_configured"}'
            StatusCode: "404"

  TestListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref TestListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values: ["/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref EcsTargetGroup

  AlbTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MainStackName}-go-alb-target-5xx"
      AlarmDescription: Go API targets returned server errors during ECS canary deployment
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AlbGenerated5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${MainStackName}-go-alb-5xx"
      AlarmDescription: Internal ALB returned server errors during ECS canary deployment
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ──────────────────────────── IAM（挂权限边界，与主栈防提权模型一致）────────────────────────────
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${MainStackName}-ecs-exec"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${MainStackName}-ecs-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 拉取容器时注入 Basic Auth 密码（DB 密码经 DATABASE_URL 组装，见任务定义）
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !ImportValue
                    Fn::Sub: "${MainStackName}-AuthSecretArn"
                  - !ImportValue
                    Fn::Sub: "${MainStackName}-DBSecretArn"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${MainStackName}-ecs-task"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${MainStackName}-ecs-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - !If
          - HasMessagingStack
          - PolicyName: publish-github-events
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: sns:Publish
                  Resource: !ImportValue
                    Fn::Sub: "${MessagingStackName}-TopicArn"
          - !Ref AWS::NoValue

  EcsInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${MainStackName}-ecs-infrastructure"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${MainStackName}-ecs-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForLoadBalancers

  CanaryHookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${MainStackName}-go-canary-hook"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${MainStackName}-lambda-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: validate-green
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !ImportValue
                  Fn::Sub: "${MainStackName}-AuthSecretArn"

  EcsLifecycleHookInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${MainStackName}-ecs-hook-invoke"
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/${MainStackName}-lambda-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-green-validation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CanaryValidationFunction.Arn

  CanaryValidationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${MainStackName}-go-green-validation"
      Description: Validates the ECS green revision through the private ALB test listener
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 20
      MemorySize: 128
      Role: !GetAtt CanaryHookRole.Arn
      VpcConfig:
        SecurityGroupIds: [!Ref CanaryHookSecurityGroup]
        SubnetIds:
          - !ImportValue
            Fn::Sub: "${MainStackName}-PrivateSubnet1"
          - !ImportValue
            Fn::Sub: "${MainStackName}-PrivateSubnet2"
      Environment:
        Variables:
          TEST_HOST: !GetAtt Alb.DNSName
          AUTH_SECRET_ARN: !ImportValue
            Fn::Sub: "${MainStackName}-AuthSecretArn"
          BASIC_AUTH_USER: !Ref BasicAuthUser
      Code:
        ZipFile: |
          const http = require("node:http");
          const { SecretsManagerClient, GetSecretValueCommand } = require("@aws-sdk/client-secrets-manager");
          const secrets = new SecretsManagerClient({});

          function request(path, authorization) {
            return new Promise((resolve, reject) => {
              const req = http.request({
                hostname: process.env.TEST_HOST,
                port: 8081,
                path,
                method: "GET",
                headers: authorization ? { authorization } : {},
                timeout: 5000,
              }, (res) => {
                res.resume();
                res.on("end", () => resolve(res.statusCode || 0));
              });
              req.on("timeout", () => req.destroy(new Error(`timeout: ${path}`)));
              req.on("error", reject);
              req.end();
            });
          }

          exports.handler = async (event) => {
            try {
              const value = await secrets.send(new GetSecretValueCommand({ SecretId: process.env.AUTH_SECRET_ARN }));
              const password = JSON.parse(value.SecretString || "{}").password;
              if (!password) throw new Error("Basic Auth password is unavailable");
              const authorization = `Basic ${Buffer.from(`${process.env.BASIC_AUTH_USER}:${password}`).toString("base64")}`;
              const health = await request("/health");
              const stats = await request("/api/stats", authorization);
              if (health !== 200 || stats !== 200) throw new Error(`green validation failed: health=${health}, stats=${stats}`);
              console.log(JSON.stringify({ result: "passed", health, stats, stage: event.lifecycleStage }));
              return { hookStatus: "SUCCEEDED" };
            } catch (error) {
              console.error(JSON.stringify({ result: "failed", message: error.message, stage: event.lifecycleStage }));
              return { hookStatus: "FAILED" };
            }
          };

  # ──────────────────────────── ECS ────────────────────────────
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${MainStackName}-cluster"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${MainStackName}-go-api"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: go-api
          Image: !Sub "${EcrRepo.RepositoryUri}:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: "8080"
            - Name: BASIC_AUTH_USER
              Value: !Ref BasicAuthUser
            - !If
              - HasMessagingStack
              - Name: GITHUB_EVENTS_TOPIC_ARN
                Value: !ImportValue
                  Fn::Sub: "${MessagingStackName}-TopicArn"
              - !Ref AWS::NoValue
            # DATABASE_URL 含密码：与主栈 Lambda 同法，用 resolve 在部署期组装内网连接串
            - Name: DATABASE_URL
              Value: !Sub
                - "postgresql://${User}:{{resolve:secretsmanager:${DBSecretArn}:SecretString:password}}@${DBHost}:5432/${DBName}?sslmode=require"
                - User: !ImportValue
                    Fn::Sub: "${MainStackName}-DBUsername"
                  DBSecretArn: !ImportValue
                    Fn::Sub: "${MainStackName}-DBSecretArn"
                  DBHost: !ImportValue
                    Fn::Sub: "${MainStackName}-DBClusterEndpoint"
                  DBName: !ImportValue
                    Fn::Sub: "${MainStackName}-DBName"
          Secrets:
            # Basic Auth 密码用 ECS secrets 注入（不落任务定义明文），取 JSON 的 password 字段
            - Name: BASIC_AUTH_PASSWORD
              ValueFrom: !Sub
                - "${AuthSecretArn}:password::"
                - AuthSecretArn: !ImportValue
                    Fn::Sub: "${MainStackName}-AuthSecretArn"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: go-api

  Service:
    Type: AWS::ECS::Service
    # 必须等监听器就绪才能把服务挂到目标组
    DependsOn: [ProductionListenerRule, TestListenerRule]
    Properties:
      ServiceName: !Sub "${MainStackName}-go-api"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 30
      DeploymentController: { Type: ECS }
      DeploymentConfiguration: !If
        - IsCanaryEnabled
        - MinimumHealthyPercent: 100
          MaximumPercent: 200
          Strategy: CANARY
          CanaryConfiguration:
            CanaryPercent: 10
            CanaryBakeTimeInMinutes: 10
          BakeTimeInMinutes: 5
          Alarms:
            Enable: true
            Rollback: true
            AlarmNames: !If
              - HasSyntheticsAlarm
              - [!Ref AlbTarget5xxAlarm, !Ref AlbGenerated5xxAlarm, !Ref SyntheticsAlarmName]
              - [!Ref AlbTarget5xxAlarm, !Ref AlbGenerated5xxAlarm]
          LifecycleHooks:
            - TargetType: AWS_LAMBDA
              HookTargetArn: !GetAtt CanaryValidationFunction.Arn
              RoleArn: !GetAtt EcsLifecycleHookInvokeRole.Arn
              LifecycleStages: [POST_TEST_TRAFFIC_SHIFT]
              TimeoutConfiguration:
                TimeoutInMinutes: 2
                Action: ROLLBACK
        - MinimumHealthyPercent: 100
          MaximumPercent: 200
          Strategy: ROLLING
      NetworkConfiguration:
        AwsvpcConfiguration:
          # 私有子网 + 经主栈 NAT 出网拉 ECR 镜像与调 GitHub；不分配公网 IP
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "${MainStackName}-PrivateSubnet1"
            - !ImportValue
              Fn::Sub: "${MainStackName}-PrivateSubnet2"
          SecurityGroups: [!Ref EcsSecurityGroup]
      LoadBalancers:
        - TargetGroupArn: !Ref EcsTargetGroup
          ContainerName: go-api
          ContainerPort: 8080
          AdvancedConfiguration: !If
            - IsCanaryEnabled
            - AlternateTargetGroupArn: !Ref EcsCanaryTargetGroup
              ProductionListenerRule: !Ref ProductionListenerRule
              TestListenerRule: !Ref TestListenerRule
              RoleArn: !GetAtt EcsInfrastructureRole.Arn
            - !Ref AWS::NoValue
      # CloudFormation 不会因省略字段而清除旧注册；Canary 模式显式传空数组。
      ServiceRegistries: !If
        - IsCanaryEnabled
        - []
        - - RegistryArn: !GetAtt CloudMapService.Arn

Outputs:
  AlbUrl:
    Description: Internal production ALB used by the Hono Lambda through private DNS
    Value: !Sub "http://${Alb.DNSName}"
  EcrRepositoryUri:
    Description: 推镜像的目标（docker push <此值>:<tag>）
    Value: !GetAtt EcrRepo.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !Sub "${MainStackName}-go-api"
  CloudMapServiceDns:
    Description: Legacy direct service-discovery name retained for rollback
    Value: !Sub "go-api.${MainStackName}.internal"
  GoApiPrivateUrl:
    Description: Stable private ALB DNS routed through ECS native Canary
    Value: !Sub "http://${Alb.DNSName}"
  CanaryStrategy:
    Condition: IsCanaryEnabled
    Value: "10 percent for 10 minutes, then 100 percent; 5 minute final bake"
  CanaryTestUrl:
    Condition: IsCanaryEnabled
    Description: Private Green-only validation endpoint, reachable only by the lifecycle hook
    Value: !Sub "http://${Alb.DNSName}:8081"
  DesiredCountEcho:
    Value: !If [HasDesiredCount, "running", "scaled-to-zero"]
