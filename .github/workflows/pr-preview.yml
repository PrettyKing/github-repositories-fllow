name: PR Preview (Go)

# 每个 PR 拉起/更新/销毁一个独立的 Go 预览环境。实际构建与部署都在 CodeBuild 里完成，
# 这里只经 OIDC 假设最小权限的 trigger 角色去 StartBuild（仓库零长期密钥）。
#
# 目前设为「手动触发」(workflow_dispatch)：在没建好 PR 预览 bootstrap 栈
# (infra/pr-preview.yml) + 配好 Secret AWS_PR_PREVIEW_TRIGGER_ROLE_ARN 之前，
# 避免每个 PR 上出现失败的检查。配好后把下面的 pull_request 触发放开、
# 并把 trigger 角色信任策略从 :pull_request 调整为对应 ref 即可自动化。
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR 编号
        required: true
      pr_action:
        description: opened / synchronize / closed
        required: true
        default: opened
      pr_head_sha:
        description: PR head commit SHA（closed 可留空）
        required: false
  # pull_request:
  #   types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  PROJECT: github-repositories-fllow-pr-preview

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PR_PREVIEW_TRIGGER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start CodeBuild preview run
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_ACTION: ${{ github.event.inputs.pr_action }}
          PR_HEAD_SHA: ${{ github.event.inputs.pr_head_sha }}
        run: |
          set -euo pipefail
          # 关闭时 PR 合并引用可能已消失，用 main 拉取模板执行拆栈；否则构建该 PR 的合并引用
          if [ "$PR_ACTION" = "closed" ]; then
            SOURCE_VERSION="main"
          else
            SOURCE_VERSION="pr/${PR_NUMBER}"
          fi
          aws codebuild start-build \
            --project-name "$PROJECT" \
            --source-version "$SOURCE_VERSION" \
            --environment-variables-override \
              "name=PR_NUMBER,value=${PR_NUMBER},type=PLAINTEXT" \
              "name=PR_ACTION,value=${PR_ACTION},type=PLAINTEXT" \
              "name=PR_HEAD_SHA,value=${PR_HEAD_SHA},type=PLAINTEXT"
