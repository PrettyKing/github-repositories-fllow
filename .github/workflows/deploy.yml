name: Deploy (SAM)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy_aiops:
        description: Deploy the Bedrock AI Ops stack after model access is confirmed
        required: false
        type: boolean
        default: false

# OIDC 假设角色需要的权限
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECS_STACK: github-repositories-fllow-ecs
  ECR_REPO: github-repositories-fllow-go-api
  MESSAGING_STACK: github-repositories-fllow-messaging
  OBSERVABILITY_STACK: github-repositories-fllow-observability
  AIOPS_STACK: github-repositories-fllow-aiops

jobs:
  # 主栈：Lambda 薄代理 + VPC + Aurora（前端已迁 Pages，这里只打 Lambda 产物）
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 打自包含 Lambda 产物 -> apps/server/dist/lambda.mjs（前端不再随 Lambda 打包）
      - name: Build Lambda bundle
        run: pnpm build:lambda

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM validate
        run: sam validate --lint --region ${{ env.AWS_REGION }}

      - name: SAM deploy
        run: |
          SYNTHETICS_ALARM=$(aws cloudformation describe-stacks --stack-name "$OBSERVABILITY_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CanarySuccessAlarmName'].OutputValue | [0]" \
            --output text 2>/dev/null || true)
          EXTRA_PARAMETERS=("ApiCodeSha256=${GITHUB_SHA}")
          if [ -n "$SYNTHETICS_ALARM" ] && [ "$SYNTHETICS_ALARM" != "None" ]; then
            EXTRA_PARAMETERS+=("SyntheticsAlarmName=${SYNTHETICS_ALARM}")
          fi
          GO_API_URL=$(aws cloudformation describe-stacks --stack-name "$ECS_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='GoApiPrivateUrl'].OutputValue | [0]" \
            --output text 2>/dev/null || true)
          if [ -n "$GO_API_URL" ] && [ "$GO_API_URL" != "None" ]; then
            EXTRA_PARAMETERS+=("GoApiUrl=${GO_API_URL}")
          fi
          if [ "${#EXTRA_PARAMETERS[@]}" -gt 0 ]; then
            sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
              --parameter-overrides "${EXTRA_PARAMETERS[@]}"
          else
            sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
          fi

      - name: Report gradual deployment result
        run: |
          APP=$(aws cloudformation list-stack-resources --stack-name github-repositories-fllow \
            --query "StackResourceSummaries[?ResourceType=='AWS::CodeDeploy::Application'].PhysicalResourceId | [0]" --output text)
          GROUP=$(aws cloudformation list-stack-resources --stack-name github-repositories-fllow \
            --query "StackResourceSummaries[?ResourceType=='AWS::CodeDeploy::DeploymentGroup'].PhysicalResourceId | [0]" --output text)
          if [ "$APP" != "None" ] && [ "$GROUP" != "None" ]; then
            DEPLOYMENT=$(aws deploy list-deployments --application-name "$APP" --deployment-group-name "$GROUP" \
              --query 'deploymentIds[0]' --output text)
            if [ "$DEPLOYMENT" != "None" ]; then
              aws deploy get-deployment --deployment-id "$DEPLOYMENT" \
                --query 'deploymentInfo.{id:deploymentId,status:status,error:errorInformation.message}'
            fi
          fi

  # 事件栈先于 ECS 部署，使 Go Task Role/环境变量可以安全引用 Topic export。
  deploy-messaging:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build event consumer
        run: pnpm --filter event-consumer build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
        with: { use-installer: true }
      - name: Deploy messaging stack
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ALARM_TOPIC=$(aws cloudformation describe-stacks --stack-name "$OBSERVABILITY_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='OpsAlertTopicArn'].OutputValue | [0]" \
            --output text 2>/dev/null || true)
          EXTRA_PARAMETERS=()
          if [ -n "$ALARM_TOPIC" ] && [ "$ALARM_TOPIC" != "None" ]; then
            EXTRA_PARAMETERS=("AlarmTopicArn=${ALARM_TOPIC}")
          fi
          sam deploy --template-file infra/messaging.yaml \
            --stack-name "$MESSAGING_STACK" --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              MainStackName=github-repositories-fllow \
              PermissionsBoundaryArn="arn:aws:iam::${AWS_ACCOUNT_ID}:policy/github-repositories-fllow-lambda-boundary" \
              "${EXTRA_PARAMETERS[@]}"

  # 检测本次 push 是否改动了 Go 服务或其 IaC，只有变了才重部署 ECS（避免每次 push 都滚服务）
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'apps/go-api/**'
              - 'apps/event-consumer/**'
              - 'infra/messaging.yaml'
              - 'infra/ecs-fargate.yaml'
              - 'infra/github-oidc.yaml'
              - '.github/workflows/deploy.yml'

  # ECS Go 栈：构建 arm64 镜像 → 推 ECR → 部署/更新服务（唯一 DB 访问方）
  # needs deploy：确保主栈（被 ECS 栈 ImportValue 依赖）先就绪，首次部署顺序正确
  deploy-ecs:
    needs: [deploy, deploy-messaging, changes]
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 首次部署：ECR 仓库尚不存在时，先以 DesiredCount=0 建栈（建出 ECR + 网络/服务骨架，
      # 无需镜像即可稳定），随后推镜像、再以 DesiredCount=1 滚起来。已存在则跳过。
      - name: Bootstrap ECS stack if first run
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1; then
            echo "First run: creating ECS stack at DesiredCount=0"
            aws cloudformation deploy \
              --template-file infra/ecs-fargate.yaml \
              --stack-name "$ECS_STACK" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset \
              --parameter-overrides DesiredCount=0 ImageTag=bootstrap
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build & push Go image (arm64)
        run: |
          REPO_URI=$(aws ecr describe-repositories --repository-names "$ECR_REPO" \
            --query 'repositories[0].repositoryUri' --output text)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO_URI%%/*}"
          docker buildx build --platform linux/arm64 \
            -t "${REPO_URI}:${GITHUB_SHA}" --push apps/go-api

      - name: Prepare ECS Canary infrastructure without shifting production traffic
        run: |
          CANARY_READY=$(aws cloudformation describe-stacks --stack-name "$ECS_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CanaryStrategy'].OutputValue | [0]" \
            --output text 2>/dev/null || true)
          if [ -z "$CANARY_READY" ] || [ "$CANARY_READY" = "None" ]; then
            CURRENT_TAG=$(aws cloudformation describe-stacks --stack-name "$ECS_STACK" \
              --query "Stacks[0].Parameters[?ParameterKey=='ImageTag'].ParameterValue | [0]" --output text)
            if [ -z "$CURRENT_TAG" ] || [ "$CURRENT_TAG" = "None" ] || [ "$CURRENT_TAG" = "bootstrap" ]; then
              CURRENT_TAG="$GITHUB_SHA"
            fi
            aws cloudformation deploy \
              --template-file infra/ecs-fargate.yaml \
              --stack-name "$ECS_STACK" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset \
              --parameter-overrides DesiredCount=1 ImageTag="$CURRENT_TAG" \
                MessagingStackName="$MESSAGING_STACK" EnableCanary=false
          else
            echo "ECS Canary infrastructure is already active"
          fi
          aws ecs wait services-stable \
            --cluster github-repositories-fllow-cluster \
            --services github-repositories-fllow-go-api

  # 首次引入 ECS Canary 时，主栈部署阶段尚读不到新的 ALB 私网地址。
  # ECS 稳定后再通过 Lambda 自己的 10% Canary 将代理切到 Internal ALB。
  activate-go-canary-route:
    needs: [deploy-ecs]
    if: ${{ needs.deploy-ecs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lambda
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
        with: { use-installer: true }
      - name: Route Hono proxy through ECS Canary ALB
        run: |
          GO_API_URL=$(aws cloudformation describe-stacks --stack-name "$ECS_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='GoApiPrivateUrl'].OutputValue | [0]" --output text)
          test -n "$GO_API_URL" && test "$GO_API_URL" != "None"
          SYNTHETICS_ALARM=$(aws cloudformation describe-stacks --stack-name "$OBSERVABILITY_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CanarySuccessAlarmName'].OutputValue | [0]" \
            --output text 2>/dev/null || true)
          PARAMETERS=("GoApiUrl=${GO_API_URL}")
          if [ -n "$SYNTHETICS_ALARM" ] && [ "$SYNTHETICS_ALARM" != "None" ]; then
            PARAMETERS+=("SyntheticsAlarmName=${SYNTHETICS_ALARM}")
          fi
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMETERS[@]}"

  deploy-ecs-canary:
    needs: [activate-go-canary-route]
    if: ${{ needs.activate-go-canary-route.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy Go image with native ECS Canary
        run: |
          SYNTHETICS_ALARM=$(aws cloudformation describe-stacks --stack-name "$OBSERVABILITY_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CanarySuccessAlarmName'].OutputValue | [0]" \
            --output text 2>/dev/null || true)
          PARAMETERS=(DesiredCount=1 "ImageTag=${GITHUB_SHA}" "MessagingStackName=${MESSAGING_STACK}" EnableCanary=true)
          if [ -n "$SYNTHETICS_ALARM" ] && [ "$SYNTHETICS_ALARM" != "None" ]; then
            PARAMETERS+=("SyntheticsAlarmName=${SYNTHETICS_ALARM}")
          fi
          aws cloudformation deploy \
            --template-file infra/ecs-fargate.yaml \
            --stack-name "$ECS_STACK" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAMETERS[@]}"
          aws ecs wait services-stable \
            --cluster github-repositories-fllow-cluster \
            --services github-repositories-fllow-go-api
          DEPLOYMENT_ARN=$(aws ecs list-service-deployments \
            --cluster github-repositories-fllow-cluster \
            --service github-repositories-fllow-go-api --max-results 1 \
            --query 'serviceDeployments[0].serviceDeploymentArn' --output text)
          test -n "$DEPLOYMENT_ARN" && test "$DEPLOYMENT_ARN" != "None"
          aws ecs describe-service-deployments --service-deployment-arns "$DEPLOYMENT_ARN" \
            --query 'serviceDeployments[0].{status:status,reason:statusReason,strategy:deploymentConfiguration.strategy,alarms:alarms.status,target:targetServiceRevision.arn}'

  deploy-observability:
    needs: [deploy, deploy-messaging, deploy-ecs, deploy-ecs-canary]
    if: ${{ always() && needs.deploy.result == 'success' && needs.deploy-messaging.result == 'success' && ((needs.deploy-ecs.result == 'skipped' && needs.deploy-ecs-canary.result == 'skipped') || needs.deploy-ecs-canary.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Package Canary in the SAM artifact bucket
        run: |
          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks --stack-name aws-sam-cli-managed-default \
            --query "Stacks[0].Outputs[?OutputKey=='SourceBucket'].OutputValue | [0]" --output text)
          test -n "$ARTIFACT_BUCKET" && test "$ARTIFACT_BUCKET" != "None"
          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/nodejs/node_modules"
          npm install --prefix "$WORK_DIR/nodejs" --omit=dev @aws-sdk/client-secrets-manager@3.848.0
          cp synthetics/api-journey.js "$WORK_DIR/nodejs/node_modules/api-journey.js"
          cd "$WORK_DIR"
          zip -qr api-journey.zip nodejs
          KEY="synthetics/api-journey-${GITHUB_SHA}.zip"
          aws s3 cp api-journey.zip "s3://${ARTIFACT_BUCKET}/${KEY}"
          VERSION=$(aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" --query VersionId --output text)
          if [ "$VERSION" = "None" ]; then VERSION=""; fi
          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_ENV"
          echo "key=$KEY" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"
      - name: Deploy observability stack
        run: |
          aws cloudformation deploy --template-file infra/observability.yaml \
            --stack-name "$OBSERVABILITY_STACK" --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              MainStackName=github-repositories-fllow \
              CanaryCodeS3Bucket="$bucket" CanaryCodeS3Key="$key" CanaryCodeS3Version="$version"

  deploy-aiops:
    needs: [deploy-observability]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_aiops }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
        with: { use-installer: true }
      - name: Build and deploy AI Ops
        run: |
          DLQ_ARN=$(aws cloudformation describe-stacks --stack-name "$MESSAGING_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DLQArn'].OutputValue | [0]" --output text)
          QUEUE_ARN=$(aws cloudformation describe-stacks --stack-name "$MESSAGING_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='QueueArn'].OutputValue | [0]" --output text)
          pnpm --filter aiops-agent build
          sam deploy --template-file infra/aiops.yaml --stack-name "$AIOPS_STACK" \
            --resolve-s3 --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              AllowedDlqArns="$DLQ_ARN" AllowedSourceQueueArns="$QUEUE_ARN"
