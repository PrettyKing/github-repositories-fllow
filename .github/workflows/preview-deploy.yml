name: PR Preview Deploy

# pull_request_target：工作流定义来自 base 分支（可信），有 secrets/OIDC。
# 安全边界：只 checkout base 的模板/脚本（可信），PR 代码仅作为 CodeBuild 的构建输入；
# fork PR 由 same-repo guard 跳过（不给部署权限）。
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# 同一 PR 的 deploy 与 destroy 串行，避免「关闭后又被部署」竞态（§并发）
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  deployments: write

env:
  AWS_REGION: ap-northeast-1
  MAIN_STACK: github-repositories-fllow
  BOOTSTRAP_STACK: github-repositories-fllow-pr-preview
  CF_ZONE: faithcal.xyz

jobs:
  deploy:
    # fork PR 不建预览（pull_request_target 会带 secrets，必须挡住不可信来源）
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.faithcal.xyz
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # base 分支的可信内容（CDK app infra/cdk、脚本 scripts/*）
      - uses: actions/checkout@v4

      # PR 代码单独 checkout 到 _pr/，仅作镜像构建上下文（同仓 PR，fork 已被 same-repo guard 挡）
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _pr

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Guard - PR 仍为 open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state -q .state)
          echo "PR #$PR state=$state"
          [ "$state" = "OPEN" ] || { echo "PR 已非 open，跳过部署"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PR_PREVIEW_OPS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read bootstrap outputs
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$BOOTSTRAP_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          {
            echo "ECR_URI=$(get PreviewEcrUri)"
            echo "RUNTIME_ROLE_ARN=$(get RuntimeRoleArn)"
            echo "BUILD_PROJECT=$(get BuildProjectName)"
            echo "CF_SECRET_ARN=$(get CloudflareSecretArn)"
            echo "ALB_DNS=$(get PreviewAlbDnsName)"
          } >> "$GITHUB_ENV"

      # 账号 CodeBuild 配额为 0，改在 Actions 里直接 buildx 打 arm64 镜像推 ECR
      - name: Build & push image (arm64, PR code)
        run: |
          set -euo pipefail
          TAG="pr-${PR}-${SHA}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_URI%%/*}"
          docker buildx build --platform linux/arm64 -t "${ECR_URI}:${TAG}" --push _pr/apps/go-api

      # 用 CDK 部署每 PR 栈（CliCredentialsStackSynthesizer：用 Ops 角色直接部署，免 bootstrap）
      - name: Deploy per-PR stack (CDK)
        working-directory: infra/cdk
        run: |
          set -euo pipefail
          EXPIRES=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)
          npm install --no-audit --no-fund
          npx cdk deploy "${MAIN_STACK}-pr-${PR}" --require-approval never \
            -c mainStackName="$MAIN_STACK" -c prNumber="$PR" \
            -c imageUri="${ECR_URI}:${TAG}" -c runtimeRoleArn="$RUNTIME_ROLE_ARN" \
            -c previewZone="$CF_ZONE" \
            --tags Environment=preview --tags Repository="$GITHUB_REPOSITORY" \
            --tags PullRequest="$PR" --tags CommitSha="$SHA" --tags ExpiresAt="$EXPIRES"

      - name: Wait for service stable
        run: |
          aws ecs wait services-stable \
            --cluster "${MAIN_STACK}-pr-${PR}" --services "${MAIN_STACK}-pr-${PR}"

      - name: Upsert Cloudflare DNS (CNAME -> 共享 ALB, DNS-only)
        run: |
          set -euo pipefail
          CF_JSON=$(aws secretsmanager get-secret-value --secret-id "$CF_SECRET_ARN" --query SecretString --output text)
          export CF_API_TOKEN=$(echo "$CF_JSON" | jq -r .apiToken)
          export CF_ZONE_ID=$(echo "$CF_JSON" | jq -r .zoneId)
          bash scripts/cloudflare-upsert-dns.sh CNAME "api-pr-${PR}.${CF_ZONE}" "$ALB_DNS" false

      - name: Health check via preview URL
        run: |
          set -euo pipefail
          URL="http://api-pr-${PR}.${CF_ZONE}/health"
          echo "健康检查 $URL"
          for i in $(seq 1 30); do
            if curl -fsS -m 5 "$URL" >/dev/null; then echo "healthy"; exit 0; fi
            sleep 6
          done
          echo "健康检查超时（DNS 传播/目标健康未就绪）"; exit 1

      # ─────────────────── 前端预览：per-PR Pages 项目 + 自定义域名 ───────────────────
      # 每 PR 一个独立 Pages 项目（自定义域名只能绑生产部署），前端 worker 同源代理到
      # 该 PR 的后端 api-pr-<n>；Basic Auth 走 Pages 环境变量（不入构建产物）。
      - name: Read Basic Auth（注入 Pages 同源代理）
        run: |
          set -euo pipefail
          AUTH_ARN=$(aws cloudformation describe-stacks --stack-name "$MAIN_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='AuthSecretArn'].OutputValue" --output text)
          AUTH_JSON=$(aws secretsmanager get-secret-value --secret-id "$AUTH_ARN" --query SecretString --output text)
          U=$(echo "$AUTH_JSON" | jq -r .username); P=$(echo "$AUTH_JSON" | jq -r .password)
          echo "::add-mask::$U"; echo "::add-mask::$P"
          echo "BASIC_AUTH_USER=$U" >> "$GITHUB_ENV"
          echo "BASIC_AUTH_PASSWORD=$P" >> "$GITHUB_ENV"

      - name: Configure per-PR Pages project（env vars 须先于 deploy）
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PROJECT="${MAIN_STACK}-pr-${PR}-web"
          echo "WEB_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          API_ORIGIN="http://api-pr-${PR}.${CF_ZONE}"
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          CFG=$(jq -n --arg api "$API_ORIGIN" --arg u "$BASIC_AUTH_USER" --arg p "$BASIC_AUTH_PASSWORD" '{
            deployment_configs: { production: { env_vars: {
              API_ORIGIN: { value: $api },
              BASIC_AUTH_USER: { value: $u },
              BASIC_AUTH_PASSWORD: { value: $p }
            }}}}')
          if curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" "${BASE}/${PROJECT}" >/dev/null 2>&1; then
            curl -fsS -X PATCH -H "Authorization: Bearer $CF_API_TOKEN" -H "content-type: application/json" \
              "${BASE}/${PROJECT}" --data "$CFG" >/dev/null
          else
            curl -fsS -X POST -H "Authorization: Bearer $CF_API_TOKEN" -H "content-type: application/json" \
              "$BASE" --data "$(echo "$CFG" | jq --arg n "$PROJECT" '. + {name:$n, production_branch:"main"}')" >/dev/null
          fi
          echo "Pages 项目 $PROJECT 已就绪（API_ORIGIN=$API_ORIGIN）"

      - name: Build frontend（PR 代码，接该 PR 后端）
        working-directory: _pr
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter web build

      - name: Deploy frontend to Pages（该项目生产部署）
        working-directory: _pr/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy out --project-name="$WEB_PROJECT" --branch=main

      - name: Attach custom domain + DNS（pr-<n>.faithcal.xyz）
        env:
          # Pages 令牌只有 Pages 编辑权，用于向项目注册自定义域名
          CF_PAGES_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DOMAIN="pr-${PR}.${CF_ZONE}"
          echo "WEB_URL=https://${DOMAIN}" >> "$GITHUB_ENV"
          # 1) Pages 侧注册自定义域名（识别 Host → 该项目 + 签发证书）
          PBASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${WEB_PROJECT}/domains"
          curl -fsS -X POST -H "Authorization: Bearer $CF_PAGES_TOKEN" -H "content-type: application/json" \
            "$PBASE" --data "$(jq -n --arg n "$DOMAIN" '{name:$n}')" >/dev/null 2>&1 \
            && echo "自定义域名 $DOMAIN 已注册" || echo "自定义域名已存在（ok）"
          # 2) 写 proxied CNAME → 项目 pages.dev（Pages 令牌无 DNS 编辑权，故用 DNS 令牌单独写）
          #    proxied=true：Cloudflare 边缘终止 SSL 并按 Host 路由到 Pages 项目
          CF_JSON=$(aws secretsmanager get-secret-value --secret-id "$CF_SECRET_ARN" --query SecretString --output text)
          export CF_API_TOKEN=$(echo "$CF_JSON" | jq -r .apiToken)
          export CF_ZONE_ID=$(echo "$CF_JSON" | jq -r .zoneId)
          bash scripts/cloudflare-upsert-dns.sh CNAME "$DOMAIN" "${WEB_PROJECT}.pages.dev" true

      - name: Health check frontend
        run: |
          set -euo pipefail
          echo "前端健康检查 $WEB_URL（自定义域名证书签发可能需 1-2 分钟）"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 8 "$WEB_URL" || true)
            if [ "$code" = "200" ]; then echo "frontend healthy"; exit 0; fi
            echo "  第 $i 次: HTTP $code"; sleep 6
          done
          echo "前端健康检查超时（证书/DNS 未就绪，可稍后手动访问）"; exit 1

      - name: Publish summary + PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number(process.env.PR);
            const web = `https://pr-${pr}.faithcal.xyz`;
            const api = `http://api-pr-${pr}.faithcal.xyz`;
            const sha = process.env.SHA;
            const anchor = '<!-- pr-preview-environment -->';
            const body = `${anchor}\n### ✅ PR 预览已部署\n\n| 组件 | 地址 |\n| --- | --- |\n| 🌐 前端预览 | ${web} |\n| API | ${api} |\n| 健康 | ${api}/health |\n\nCommit: \`${sha}\``;
            core.summary.addRaw(body).write();
            const { owner, repo } = context.repo;
            const list = await github.rest.issues.listComments({ owner, repo, issue_number: pr });
            const existing = list.data.find(c => c.body && c.body.includes(anchor));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
            }
