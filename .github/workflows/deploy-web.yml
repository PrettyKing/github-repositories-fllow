name: Deploy Web (Cloudflare Pages)

# 前端 Next.js 静态导出 → Cloudflare Pages（架构图 CI/CD 的 Web 线）。
# 自定义域名 app.faithcal.xyz 在 Pages 项目里绑定；同源 /api 由 out/_redirects 代理到 API Gateway。
on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build static export (out/)
        run: pnpm --filter web build

      # 直接用 npx wrangler（绕开 wrangler-action 在 pnpm workspace 里的安装问题）
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 首次自动建 Direct-Upload 项目（已存在则忽略），再部署 out/
          npx --yes wrangler@3 pages project create github-repositories-fllow-web --production-branch main || true
          npx --yes wrangler@3 pages deploy out --project-name=github-repositories-fllow-web --branch=main
